name: CGV Yongsan IMAX Checker

on:
  schedule:
    # 15분마다 실행 (GitHub 무료 스케줄은 부하가 많으면 몇 분 지연될 수 있음)
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동으로도 바로 실행해볼 수 있게 함

permissions:
  contents: write   # state.json 커밋을 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MOVIE_KEYWORD: "오디세이"
        run: python check.py

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state.json [skip ci]"
          git push
